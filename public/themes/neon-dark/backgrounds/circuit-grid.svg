<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1100" viewBox="0 0 3840 1100">
  <defs>
    <pattern id="small-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#0a84ff" stroke-opacity=".16" stroke-width="2"/>
      <path d="M40 0V80M0 40H80" fill="none" stroke="#bf5af2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0a84ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="3840" height="1100" fill="url(#small-grid)"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M120 180H860V320H1360" stroke="url(#trace)" stroke-width="5"/>
    <path d="M620 790H1220V650H1900V500H2540" stroke="url(#trace)" stroke-width="4"/>
    <path d="M2280 220H2820V360H3400" stroke="url(#trace)" stroke-width="5"/>
    <path d="M2680 900H3160V720H3740" stroke="url(#trace)" stroke-width="4"/>
  </g>
  <g fill="#0a84ff" opacity=".52" filter="url(#glow)">
    <circle cx="860" cy="180" r="8"/>
    <circle cx="1360" cy="320" r="8"/>
    <circle cx="1900" cy="650" r="7"/>
    <circle cx="2820" cy="220" r="8"/>
    <circle cx="3400" cy="360" r="8"/>
  </g>
</svg>
